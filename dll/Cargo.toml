[package]
name = "autoenc"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
cbc = "0.2.1"
cipher = "0.5.2"
log = "0.4.34"
pelite = { version = "0.10.0", default-features = false }
postcard = { version = "1.1.3", default-features = false, features = [
    "use-std",
] }
serde = { version = "1.0.229", features = ["derive"] }
sevenz-rust2 = { version = "0.23.0", default-features = false, features = [
    "compress",
] }
thiserror = "2.0.20"
toml = { version = "1.1.6", default-features = false, features = [
    "std",
    "serde",
    "parse",
] }
widestring = "1.2.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_UI_WindowsAndMessaging",
] }
